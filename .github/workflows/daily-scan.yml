name: Daily OTIS opportunity scan
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: otis-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize tracker data
        run: python scripts/normalize_data.py
      - name: Scan configured public sources
        run: python scripts/scan.py
      - name: Validate generated official records
        run: python scripts/validate_records.py
      - name: Commit refreshed scan artifacts and tracker records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-scan.json reports/candidates.json reports/validation.json data/opportunities.json data/opportunities.csv
          if git diff --cached --quiet; then echo "No scan artifact changes to commit."; else git commit -m "chore: daily OTIS opportunity scan" && git push; fi
